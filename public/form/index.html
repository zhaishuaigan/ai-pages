            function visibleCfs(excludeDragging) {
                return Array.prototype.slice.call(listEl.querySelectorAll('.cf')).filter(function (el) {
                    return !(excludeDragging && el.classList.contains('dragging'));
                });
            }

            function computeIndex(clientY) {
                var cfs = visibleCfs(dragData && dragData.source === 'canvas');
                for (var i = 0; i < cfs.length; i++) {
                    var r = cfs[i].getBoundingClientRect();
                    if (clientY < r.top + r.height / 2) return i;
                }
                return cfs.length;
            }

            function placeIndicator(idx) {
                dropIdx = idx;
                listEl.classList.add('drag-over');
                var line = getLine();
                var cfs = visibleCfs(dragData && dragData.source === 'canvas');
                var ref = cfs[idx] || null;
                if (ref) {
                    listEl.insertBefore(line, ref);
                } else {
                    listEl.appendChild(line);
                }
            }

            /* ================= 字段增删改 ================= */
            function addField(type, index) {
                var f = createField(type);
                if (index === undefined || index === null || index < 0 || index > fields.length) {
                    fields.push(f);
                } else {
                    fields.splice(index, 0, f);
                }
                selectedId = f.id;
                renderCanvas();
                saveDraft();
            }

            function deleteField(id) {
                var idx = fields.findIndex(function (f) { return f.id === id; });
                if (idx < 0) return;
                fields.splice(idx, 1);
                if (selectedId === id) selectedId = null;
                renderCanvas();
                saveDraft();
                toast('已删除');
            }

            /* ================= 属性设置弹窗 ================= */
            function optionRowHtml(o) {
                return '<div class="opt-row">'
                    + '<input class="si opt-label" type="text" value="' + esc(o.label) + '" placeholder="选项文字">'
                    + '<input class="si opt-value" type="text" value="' + esc(o.value) + '" placeholder="提交值">'
                    + '<button class="opt-del" type="button" title="删除该选项">' + icon('trash') + '</button>'
                    + '</div>';
            }

            /* 数据源复合控件：静态选项 / 接口获取 两种来源 */
            function renderDatasourceControl(item) {
                var f = fields.find(function (x) { return x.id === editingId; });
                var p = f ? f.props : {};
                var kind = item.kind || 'options';
                var source = p.dataSource === 'api' ? 'api' : 'static';

                function dsInput(subKey, label, ph, inputType) {
                    return '<div class="ds-field"><label class="sl">' + esc(label) + '</label>'
                        + '<input class="si" type="' + (inputType || 'text') + '" data-sub-key="' + subKey + '"'
                        + ' value="' + esc(p[subKey] == null ? '' : p[subKey]) + '" placeholder="' + esc(ph || '') + '"></div>';
                }

                /* 静态数据面板 */
                var staticPanel;
                if (kind === 'cascade') {
                    staticPanel = '<div class="ds-field"><label class="sl">级联数据（JSON 格式，支持对象嵌套）</label>'
                        + '<textarea class="si" data-sub-key="dataJson" placeholder="{&quot;广东省&quot;:{&quot;广州市&quot;:[&quot;天河区&quot;]}}">'
                        + esc(p.dataJson || '{}') + '</textarea>'
                        + '<div class="set-hint">对象嵌套表示层级，最后一层为字符串数组；也支持 [{label,value,children}] 树形数组。</div></div>';
                } else {
                    var rows = (p.options || []).map(optionRowHtml).join('');
                    staticPanel = '<div class="opt-box" data-options-box>' + rows
                        + '<button class="btn ghost" type="button" data-act="add-opt">' + icon('plus') + '添加选项</button></div>';
                }

                /* 接口配置面板 */
                var methodGet = (p.apiMethod || 'GET') === 'GET';
                var apiPanel = '<div>'
                    + dsInput('apiUrl', '接口地址', 'https://example.com/api/options')
                    + '<div class="ds-field"><label class="sl">请求方法</label>'
                    + '<select class="si" data-sub-key="apiMethod">'
                    + '<option value="GET"' + (methodGet ? ' selected' : '') + '>GET</option>'
                    + '<option value="POST"' + (!methodGet ? ' selected' : '') + '>POST</option>'
                    + '</select></div>'
                    + dsInput('apiPath', '数据路径（点号分隔，留空取整个返回）', 'data.list')
                    + '<div class="ds-field"><div style="display:flex;gap:8px">'
                    + '<div style="flex:1"><label class="sl">标签字段名</label><input class="si" type="text" data-sub-key="labelField" value="' + esc(p.labelField || '') + '" placeholder="label（默认）"></div>'
                    + '<div style="flex:1"><label class="sl">值字段名</label><input class="si" type="text" data-sub-key="valueField" value="' + esc(p.valueField || '') + '" placeholder="value（默认）"></div>'
                    + '</div></div>';
                if (kind === 'cascade') {
                    apiPanel += '<div class="ds-field"><label class="sl">子级字段名</label>'
                        + '<input class="si" type="text" data-sub-key="childrenField" value="' + esc(p.childrenField || '') + '" placeholder="children（默认）"></div>'
                        + '<div class="set-hint" style="margin:0 0 10px">接口需返回树形数组，每项包含标签、值和子级数组。</div>';
                } else {
                    apiPanel += '<div class="set-hint" style="margin:0 0 10px">接口需返回数组，每项为字符串或包含标签/值字段的对象，例如：{"code":0,"data":{"list":[{"label":"选项一","value":1}]}}。</div>';
                }
                apiPanel += '<button class="btn" type="button" data-act="test-api" style="width:100%;justify-content:center">'
                    + icon('eye') + '测试接口</button>'
                    + '<div class="api-test-result" data-api-test-result></div>'
                    + '</div>';

                return '<div class="ds-box" data-ds-box="' + kind + '">'
                    + '<div class="ds-tabs">'
                    + '<button type="button" class="ds-tab' + (source === 'static' ? ' is-active' : '') + '" data-act="ds-tab" data-tab="static">静态数据</button>'
                    + '<button type="button" class="ds-tab' + (source === 'api' ? ' is-active' : '') + '" data-act="ds-tab" data-tab="api">接口获取</button>'
                    + '</div>'
                    + '<input type="hidden" data-key="dataSource" value="' + source + '">'
                    + '<div class="ds-panel" data-panel="static"' + (source === 'api' ? ' hidden' : '') + '>' + staticPanel + '</div>'
                    + '<div class="ds-panel" data-panel="api"' + (source === 'static' ? ' hidden' : '') + '>' + apiPanel + '</div>'
                    + '</div>';
            }

            function renderSettingControl(item, value) {
                var key = ' data-key="' + item.key + '"';
                switch (item.type) {
                    case 'textarea':
                        return '<textarea class="si"' + key + ' placeholder="' + esc(item.ph || '') + '">' + esc(value == null ? '' : value) + '</textarea>';
                    case 'number':
                        return '<input class="si" type="text" inputmode="decimal"' + key + ' value="' + esc(value == null ? '' : value) + '" placeholder="留空则不限制">';
                    case 'switch':
                        return '<label class="mswitch"><input type="checkbox"' + key + (value ? ' checked' : '') + '><span class="mswitch-track"></span><span class="mswitch-label">' + esc(item.label) + '</span></label>';
                    case 'select':
                        return '<select class="si"' + key + '>' + item.options.map(function (op) {
                            return '<option value="' + esc(op[0]) + '"' + (String(value) === String(op[0]) ? ' selected' : '') + '>' + esc(op[1]) + '</option>';
                        }).join('') + '</select>';
                    case 'options':
                        var rows = (value || []).map(optionRowHtml).join('');
                        return '<div class="opt-box" data-options-box>' + rows
                            + '<button class="btn ghost" type="button" data-act="add-opt">' + icon('plus') + '添加选项</button></div>';
                    case 'datasource':
                        return renderDatasourceControl(item);
                    default:
                        return '<input class="si" type="' + (item.inputType || 'text') + '"' + key
                            + ' value="' + esc(value == null ? '' : value) + '" placeholder="' + esc(item.ph || '') + '">';
                }
            }

            function openFieldSettings(id) {
                var f = fields.find(function (x) { return x.id === id; });
                if (!f) return;
                editingId = id;
                $('settingsTitle').textContent = '字段属性 · ' + (TYPE_LABELS[f.type] || f.type);
                var schema = SCHEMAS[f.type] || [];
                $('settingsBody').innerHTML = schema.map(function (item) {
                    var control = renderSettingControl(item, f.props[item.key]);
                    if (item.type === 'switch') {
                        return '<div class="set-row">' + control + '</div>';
                    }
                    return '<div class="set-row"><label class="sl">' + esc(item.label) + '</label>' + control + '</div>';
                }).join('');
                openMask($('settingsMask'));
            }

            function collectOptions() {
                return Array.prototype.slice.call($('settingsBody').querySelectorAll('.opt-row')).map(function (row) {
                    return {
                        label: row.querySelector('.opt-label').value.trim(),
                        value: row.querySelector('.opt-value').value.trim()
                    };
                }).filter(function (o) {
                    return o.label !== '';
                }).map(function (o) {
                    if (o.value === '') o.value = o.label;
                    return o;
                });
            }

            /* 收集数据源复合控件的所有字段 */
            function collectDatasource(patch, kind) {
                var box = $('settingsBody').querySelector('[data-ds-box]');
                if (!box) return;
                var source = box.querySelector('[data-key="dataSource"]').value;
                patch.dataSource = source === 'api' ? 'api' : 'static';
                ['apiUrl', 'apiMethod', 'apiPath', 'labelField', 'valueField', 'childrenField'].forEach(function (k) {
                    var inp = box.querySelector('[data-sub-key="' + k + '"]');
                    if (inp) patch[k] = inp.value.trim();
                });
                if (patch.dataSource === 'static') {
                    if (kind === 'cascade') {
                        var jsonArea = box.querySelector('[data-sub-key="dataJson"]');
                        patch.dataJson = jsonArea ? jsonArea.value : '{}';
                    } else {
                        patch.options = collectOptions();
                    }
                }
            }

            /* 按点号路径取数据，如 data.list */
            function resolveDataPath(obj, path) {
                if (!path) return obj;
                var cur = obj;
                path.split('.').forEach(function (seg) {
                    if (cur == null) return;
                    cur = cur[seg];
                });
                return cur;
            }

            function pickField(item, customKey, a, b) {
                if (customKey && item[customKey] != null && item[customKey] !== '') return item[customKey];
                if (item[a] != null && item[a] !== '') return item[a];
                return item[b];
            }

            /* 设置弹窗中的"测试接口" */
            function testDatasourceApi(box, btn) {
                var kind = box.getAttribute('data-ds-box');
                var cfg = {
                    url: box.querySelector('[data-sub-key="apiUrl"]').value.trim(),
                    method: box.querySelector('[data-sub-key="apiMethod"]').value || 'GET',
                    path: box.querySelector('[data-sub-key="apiPath"]').value.trim(),
                    labelField: box.querySelector('[data-sub-key="labelField"]').value.trim(),
                    valueField: box.querySelector('[data-sub-key="valueField"]').value.trim(),
                    childrenField: (box.querySelector('[data-sub-key="childrenField"]') || {}).value
                };
                var resultEl = box.querySelector('[data-api-test-result]');
                if (!cfg.url) {
                    resultEl.className = 'api-test-result err';
                    resultEl.textContent = '请先填写接口地址';
                    return;
                }
                btn.disabled = true;
                resultEl.className = 'api-test-result';
                resultEl.textContent = '请求中…';

                fetch(cfg.url, cfg.method === 'POST' ? { method: 'POST' } : {})
                    .then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function (raw) {
                        var arr = resolveDataPath(raw, cfg.path);
                        if (!Array.isArray(arr)) throw new Error('数据路径"' + (cfg.path || '（根）') + '"下不是数组');
                        if (kind === 'cascade') {
                            var chKey = cfg.childrenField ? cfg.childrenField.trim() : 'children';
                            var count = 0;
                            function walk(list, depth) {
                                list.forEach(function (it) {
                                    count++;
                                    if (it && typeof it === 'object') {
                                        var ch = it[chKey] || it.children;
                                        if (Array.isArray(ch) && ch.length) walk(ch, depth + 1);
                                    }
                                });
                            }
                            walk(arr, 1);
                            resultEl.className = 'api-test-result ok';
                            resultEl.textContent = '测试成功：共 ' + count + ' 个节点，一级 ' + arr.length + ' 个';
                        } else {
                            var sample = arr.slice(0, 3).map(function (it) {
                                if (it && typeof it === 'object') {
                                    return String(pickField(it, cfg.labelField, 'label', 'name'));
                                }
                                return String(it);
                            });
                            resultEl.className = 'api-test-result ok';
                            resultEl.textContent = '测试成功：共 ' + arr.length + ' 条数据，前几项：' + sample.join('、');
                        }
                    })
                    .catch(function (err) {
                        resultEl.className = 'api-test-result err';
                        resultEl.textContent = '请求失败：' + err.message;
                    })
                    .then(function () {
                        btn.disabled = false;
                    });
            }

            function saveFieldSettings() {
                var f = fields.find(function (x) { return x.id === editingId; });
                if (!f) { closeMask($('settingsMask')); return; }
                var schema = SCHEMAS[f.type] || [];
                var patch = {};
                var missing = false;

                schema.forEach(function (item) {
                    var node = $('settingsBody').querySelector('[data-key="' + item.key + '"]');
                    if (item.type === 'switch') {
                        patch[item.key] = node.checked;
                    } else if (item.type === 'options') {
                        patch.options = collectOptions();
                    } else if (item.type === 'datasource') {
                        collectDatasource(patch, item.kind);
                    } else {
                        patch[item.key] = node.value;
                    }
                });

                if (!LAYOUT_TYPES[f.type]) {
                    if (!patch.label || !patch.label.trim()) {
                        toast('请填写字段标签');
                        return;
                    }
                    if (!patch.name || !patch.name.trim()) {
                        toast('请填写字段名（name）');
                        return;
                    }
                    if (!/^[A-Za-z_][A-Za-z0-9_-]*$/.test(patch.name.trim())) {
                        toast('字段名需以字母或下划线开头，只能包含字母、数字、下划线、中划线');
                        return;
                    }
                    var dup = fields.some(function (o) {
                        return o.id !== f.id && o.props && o.props.name === patch.name.trim();
                    });
                    if (dup) {
                        toast('字段名「' + patch.name + '」已存在，请更换');
                        return;
                    }
                    patch.name = patch.name.trim();
                    var isOptionsType = (f.type === 'select' || f.type === 'radio' || f.type === 'checkbox');
                    var isApi = patch.dataSource === 'api';
                    if (isOptionsType || f.type === 'cascade') {
                        if (isApi) {
                            if (!patch.apiUrl) {
                                toast('请填写接口地址');
                                return;
                            }
                        } else {
                            if (isOptionsType && (!patch.options || !patch.options.length)) {
                                toast('请至少添加一个选项');
                                return;
                            }
                            if (f.type === 'cascade') {
                                try {
                                    var parsed = JSON.parse(patch.dataJson || '{}');
                                    if (typeof parsed !== 'object' || parsed === null) throw new Error('bad');
                                } catch (e) {
                                    toast('级联数据不是有效的 JSON 格式');
                                    return;
                                }
                            }
                        }
                    }
                    if (f.type === 'rating') {
                        var mx = parseInt(patch.max, 10);
                        if (!mx || mx < 1 || mx > 20) {
                            toast('最大星数请填 1-20 之间的整数');
                            return;
                        }
                    }
                }

                Object.assign(f.props, patch);
                closeMask($('settingsMask'));
                editingId = null;
                renderCanvas();
                saveDraft();
                toast('属性已保存');
            }

            function exportHtml() {
                var sharedCss = $('sharedFormStyle').textContent;
                var rows = fields.map(function (f) { return fieldHtml(f, 'export'); }).join('\n                        ');

                var html = [
                    '<!DOCTYPE html>',

            /* ================= 导出表单的运行时（预览同样调用） ================= */
            function bootstrapForm(form, opts) {
                opts = opts || {};

                /* 导出后独立运行所需的最小转义工具 */
                function escHtml(s) {
                    return String(s == null ? '' : s)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;');
                }
                var escAttr = escHtml;
                var escText = escHtml;

                function extractUrls(data) {
                    var urls = [];
                    function push(v) {
                        if (typeof v === 'string' && v) urls.push(v);
                    }
                    if (!data) return urls;
                    if (typeof data === 'string') {
                        push(data);
                    } else if (Array.isArray(data)) {
                        data.forEach(function (x) {
                            if (typeof x === 'string') push(x);
                            else if (x && typeof x.url === 'string') push(x.url);
                        });
                    } else {
                        push(data.url);
                        if (Array.isArray(data.urls)) data.urls.forEach(push);
                        if (data.data) {
                            push(data.data.url);
                            if (Array.isArray(data.data.urls)) data.data.urls.forEach(push);
                            if (Array.isArray(data.data.list)) {
                                data.data.list.forEach(function (x) {
                                    if (x && typeof x.url === 'string') push(x.url);
                                });
                            }
                        }
                    }
                    return urls;
                }

                /* 文件/图片异步上传 */
                Array.prototype.forEach.call(form.querySelectorAll('[data-upload]'), function (wrap) {
                    var fileInput = wrap.querySelector('input[type=file]');
                    var hidden = wrap.querySelector('input[type=hidden]');
                    var btn = wrap.querySelector('.upload-btn');
                    var status = wrap.querySelector('.upload-status');
                    var action = wrap.getAttribute('data-action');

                    btn.addEventListener('click', function () {
                        fileInput.click();
                    });

                    fileInput.addEventListener('change', function () {
                        if (!fileInput.files.length) return;
                        var names = Array.prototype.map.call(fileInput.files, function (f) { return f.name; });
                        wrap.classList.remove('is-invalid');

                        if (!action) {
                            status.className = 'upload-status err';
                            status.textContent = '未配置上传接口地址';
                            return;
                        }

                        status.className = 'upload-status';
                        status.textContent = '上传中…';
                        var fd = new FormData();
                        Array.prototype.forEach.call(fileInput.files, function (f) {
                            fd.append(fileInput.name, f);
                        });

                        fetch(action, { method: 'POST', body: fd }).then(function (res) {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            var ct = res.headers.get('content-type') || '';
                            if (ct.indexOf('application/json') >= 0) return res.json();
                            return res.text().then(function (t) {
                                try { return JSON.parse(t); } catch (e) { return { url: t }; }
                            });
                        }).then(function (data) {
                            hidden.value = extractUrls(data).join(',');
                            fileInput.setAttribute('data-uploaded', '1');
                            status.className = 'upload-status ok';
                            status.textContent = '已上传：' + names.join('、');
                        }).catch(function (err) {
                            status.className = 'upload-status err';
                            status.textContent = '上传失败：' + err.message;
                        });
                    });
                });

                /* 多选框组必填：勾选后清除错误态（事件委托，兼容接口动态加载的选项） */
                form.addEventListener('change', function (e) {
                    var g = e.target && e.target.closest ? e.target.closest('[data-check-required="1"]') : null;
                    if (g) g.classList.remove('is-invalid');
                    /* 接口下拉 / 级联变化时清除错误态 */
                    var apiSel = e.target && e.target.closest ? e.target.closest('[data-api-options], [data-cascade]') : null;
                    if (apiSel) apiSel.classList.remove('is-invalid');
                });

                /* 评分组件：点击星星 */
                Array.prototype.forEach.call(form.querySelectorAll('[data-rating]'), function (wrap) {
                    var hidden = wrap.querySelector('input[type=hidden]');
                    var stars = wrap.querySelectorAll('.star');
                    var textEl = wrap.querySelector('.rating-text');
                    var max = parseInt(wrap.getAttribute('data-max'), 10) || 5;

                    function paint(val, isHover) {
                        stars.forEach(function (s) {
                            var sv = parseInt(s.getAttribute('data-val'), 10);
                            s.classList.toggle(isHover ? 'hover-active' : 'active', sv <= val);
                            if (isHover) s.classList.remove('active');
                            else s.classList.remove('hover-active');
                        });
                    }

                    function setText(val) {
                        textEl.textContent = val > 0 ? val + '/' + max : '';
                    }

                    stars.forEach(function (s) {
                        s.addEventListener('click', function () {
                            var val = parseInt(s.getAttribute('data-val'), 10);
                            hidden.value = val;
                            wrap.setAttribute('data-value', val);
                            wrap.classList.remove('is-invalid');
                            paint(val, false);
                            setText(val);
                        });
                        s.addEventListener('mouseenter', function () {
                            paint(parseInt(s.getAttribute('data-val'), 10), true);
                        });
                    });
                    wrap.querySelector('.stars').addEventListener('mouseleave', function () {
                        var cur = parseInt(hidden.value, 10) || 0;
                        paint(cur, false);
                    });
                });

                /* 接口数据源：下拉 / 单选组 / 多选组 运行时加载 */
                function resolveApiPath(obj, path) {
                    if (!path) return obj;
                    var cur = obj;
                    path.split('.').forEach(function (seg) {
                        if (cur == null) return;
                        cur = cur[seg];
                    });
                    return cur;
                }

                function apiPick(item, customKey, a, b) {
                    if (customKey && item[customKey] != null && item[customKey] !== '') return item[customKey];
                    if (item[a] != null && item[a] !== '') return item[a];
                    return item[b];
                }

                function normalizeApiOptions(arr, labelField, valueField) {
                    return (arr || []).map(function (it) {
                        if (it === null || typeof it !== 'object') {
                            return { label: String(it), value: String(it) };
                        }
                        var label = apiPick(it, labelField, 'label', 'name');
                        var value = apiPick(it, valueField, 'value', 'id');
                        return { label: String(label), value: String(value) };
                    });
                }

                function fetchApiJson(el) {
                    var url = el.getAttribute('data-api-url');
                    var method = el.getAttribute('data-api-method') || 'GET';
                    return fetch(url, method === 'POST' ? { method: 'POST' } : {})
                        .then(function (res) {
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.json();
                        })
                        .then(function (raw) {
                            return resolveApiPath(raw, el.getAttribute('data-api-path') || '');
                        });
                }

                Array.prototype.forEach.call(form.querySelectorAll('[data-api-options="1"]'), function (el) {
                    var lf = el.getAttribute('data-api-label') || '';
                    var vf = el.getAttribute('data-api-value') || '';

                    fetchApiJson(el).then(function (arr) {
                        if (!Array.isArray(arr)) throw new Error('接口返回不是数组');
                        var options = normalizeApiOptions(arr, lf, vf);

                        if (el.tagName === 'SELECT') {
                            var placeholder = el.getAttribute('data-placeholder') || '请选择';
                            var selRequired = el.getAttribute('data-required') === '1';
                            if (selRequired) el.setAttribute('required', 'required');
                            el.innerHTML = '<option value="">' + placeholder + '</option>'
                                + options.map(function (o) {
                                    return '<option value="' + escAttr(o.value) + '">' + escText(o.label) + '</option>';
                                }).join('');
                        } else {
                            /* radio / checkbox 组 */
                            var kind = el.getAttribute('data-kind') || 'radio';
                            var baseName = el.getAttribute('data-name') || '';
                            var inputName = kind === 'checkbox' ? baseName + '[]' : baseName;
                            var required = el.getAttribute('data-required') === '1';
                            el.className = 'f-opts' + (el.getAttribute('data-inline') === '1' ? ' inline' : '');
                            if (kind === 'checkbox' && required) el.setAttribute('data-check-required', '1');
                            el.innerHTML = options.map(function (o) {
                                return '<label class="opt"><input type="' + kind + '" name="' + escAttr(inputName) + '" value="' + escAttr(o.value) + '"'
                                    + (kind === 'radio' && required ? ' required' : '')
                                    + '><span class="opt-text">' + escText(o.label) + '</span></label>';
                            }).join('');
                        }
                    }).catch(function (err) {
                        if (el.tagName === 'SELECT') {
                            el.innerHTML = '<option value="">选项加载失败</option>';
                            el.disabled = true;
                        } else {
                            el.innerHTML = '<span class="api-error">选项加载失败：' + escText(err.message) + '</span>';
                        }
                    });
                });

                /* 级联选择：多级联动（支持静态 JSON 与接口树形数据） */
                Array.prototype.forEach.call(form.querySelectorAll('[data-cascade]'), function (wrap) {
                    var hidden = wrap.querySelector('input[type=hidden]');
                    var sels = wrap.querySelectorAll('.cascade-sel');
                    var ph = wrap.getAttribute('data-placeholder') || '请选择';
                    var useApi = wrap.getAttribute('data-api-cascade') === '1';

                    /* 对象嵌套（静态）转统一树形结构 {label,value,children} */
                    function objToTree(obj) {
                        if (Array.isArray(obj)) {
                            return obj.map(function (x) {
                                if (x !== null && typeof x === 'object') {
                                    var label = x.label != null ? x.label : x.name;
                                    var value = x.value != null ? x.value : x.id;
                                    var ch = Array.isArray(x.children) && x.children.length ? objToTree(x.children) : null;
                                    return { label: String(label), value: String(value), children: ch };
                                }
                                return { label: String(x), value: String(x), children: null };
                            });
                        }
                        if (obj && typeof obj === 'object') {
                            return Object.keys(obj).map(function (k) {
                                var child = obj[k];
                                var hasChild = child !== null && typeof child === 'object';
                                return { label: k, value: k, children: hasChild ? objToTree(child) : null };
                            });
                        }
                        return [];
                    }

                    /* 接口树形数组转统一结构 */
                    function apiToTree(arr) {
                        var lf = wrap.getAttribute('data-api-label') || '';
                        var vf = wrap.getAttribute('data-api-value') || '';
                        var cf = wrap.getAttribute('data-api-children') || '';
                        return (arr || []).map(function (it) {
                            if (it === null || typeof it !== 'object') {
                                return { label: String(it), value: String(it), children: null };
                            }
                            var label = apiPick(it, lf, 'label', 'name');
                            var value = apiPick(it, vf, 'value', 'id');
                            var childrenKey = cf || 'children';
                            var ch = Array.isArray(it[childrenKey]) && it[childrenKey].length
                                ? apiToTree(it[childrenKey])
                                : null;
                            return { label: String(label), value: String(value), children: ch };
                        });
                    }

                    function fillLevel(level, nodes) {
                        var sel = sels[level];
                        if (!sel) return;
                        while (sel.options.length > 1) sel.remove(1);
                        (nodes || []).forEach(function (n) {
                            var opt = document.createElement('option');
                            opt.value = n.value;
                            opt.textContent = n.label;
                            opt._node = n;
                            sel.appendChild(opt);
                        });
                        sel.disabled = !(nodes && nodes.length);
                    }

                    function clearFrom(level) {
                        for (var i = level; i < sels.length; i++) {
                            sels[i].value = '';
                            while (sels[i].options.length > 1) sels[i].remove(1);
                            sels[i].disabled = true;
                        }
                    }

                    function syncHidden() {
                        var path = [];
                        for (var i = 0; i < sels.length; i++) {
                            if (sels[i].value) path.push(sels[i].value);
                            else break;
                        }
                        hidden.value = path.join(' / ');
                        wrap.classList.remove('is-invalid');
                    }

                    function bindEvents() {
                        Array.prototype.forEach.call(sels, function (sel, idx) {
                            sel.addEventListener('change', function () {
                                clearFrom(idx + 1);
                                var chosen = sel.selectedOptions && sel.selectedOptions[0];
                                var node = chosen && chosen._node;
                                if (node && node.children && idx + 1 < sels.length) {
                                    fillLevel(idx + 1, node.children);
                                }
                                syncHidden();
                            });
                        });
                    }

                    function init(tree) {
                        fillLevel(0, tree);
                        for (var i = 1; i < sels.length; i++) sels[i].disabled = true;
                        bindEvents();
                    }

                    if (useApi) {
                        /* 接口模式：第一级先展示加载态 */
                        var firstSel = sels[0];
                        var loadingOpt = document.createElement('option');
                        loadingOpt.value = '';
                        loadingOpt.disabled = true;
                        loadingOpt.textContent = '加载中…';
                        firstSel.appendChild(loadingOpt);

                        fetchApiJson(wrap).then(function (arr) {
                            if (!Array.isArray(arr)) throw new Error('接口返回不是数组');
                            firstSel.removeChild(loadingOpt);
                            init(apiToTree(arr));
                        }).catch(function (err) {
                            loadingOpt.textContent = '加载失败';
                            firstSel.disabled = true;
                        });
                    } else {
                        var data;
                        try { data = JSON.parse(wrap.getAttribute('data-json') || '{}'); } catch (e) { data = {}; }
                        init(objToTree(data));
                    }
                });

                /* 富文本编辑器 */
                Array.prototype.forEach.call(form.querySelectorAll('[data-richtext]'), function (wrap) {
                    var hidden = wrap.querySelector('input[type=hidden]');
                    var editor = wrap.querySelector('.rt-editor');
                    var btns = wrap.querySelectorAll('.rt-btn');

                    function sync() {
                        hidden.value = editor.innerHTML.trim();
                        wrap.classList.remove('is-invalid');
                    }

                    btns.forEach(function (btn) {
                        btn.addEventListener('click', function (e) {
                            e.preventDefault();
                            var cmd = btn.getAttribute('data-cmd');
                            editor.focus();
                            if (cmd === 'createLink') {
                                var url = window.prompt('请输入链接地址：', 'https://');
                                if (url) document.execCommand('createLink', false, url);
                            } else if (cmd === 'formatBlock') {
                                document.execCommand('formatBlock', false, btn.getAttribute('data-val') || 'blockquote');
                            } else {
                                document.execCommand(cmd, false, null);
                            }
                            sync();
                        });
                    });

                    editor.addEventListener('input', sync);
                    editor.addEventListener('blur', sync);
                });

                var msg = form.querySelector('[data-form-msg]');
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    msg.className = 'form-msg';
                    msg.textContent = '';

                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    var valid = true;
                    Array.prototype.forEach.call(form.querySelectorAll('[data-check-required="1"]'), function (g) {
                        if (!g.querySelectorAll('input[type=checkbox]:checked').length) {
                            g.classList.add('is-invalid');
                            valid = false;
                        }
                    });
                    Array.prototype.forEach.call(form.querySelectorAll('[data-upload]'), function (wrap) {
                        if (wrap.getAttribute('data-required') === '1') {
                            var hidden = wrap.querySelector('input[type=hidden]');
                            var fileInput = wrap.querySelector('input[type=file]');
                            if (!hidden.value && !fileInput.files.length) {
                                wrap.classList.add('is-invalid');
                                valid = false;
                            }
                        }
                    });
                    /* 评分必填校验 */
                    Array.prototype.forEach.call(form.querySelectorAll('[data-rating]'), function (wrap) {
                        if (wrap.getAttribute('data-required') === '1') {
                            var rv = parseInt(wrap.querySelector('input[type=hidden]').value, 10) || 0;
                            if (rv <= 0) { wrap.classList.add('is-invalid'); valid = false; }
                        }
                    });
                    /* 级联选择必填校验 */
                    Array.prototype.forEach.call(form.querySelectorAll('[data-cascade]'), function (wrap) {
                        if (wrap.getAttribute('data-required') === '1') {
                            var cv = wrap.querySelector('input[type=hidden]').value;
                            if (!cv) { wrap.classList.add('is-invalid'); valid = false; }
                        }
                    });
                    /* 富文本必填校验 */
                    Array.prototype.forEach.call(form.querySelectorAll('[data-richtext]'), function (wrap) {
                        if (wrap.getAttribute('data-required') === '1') {
                            var rt = wrap.querySelector('input[type=hidden]').value;
                            /* 去除空标签后的纯文本 */
                            var tmp = document.createElement('div');
                            tmp.innerHTML = rt;
                            if (!tmp.textContent.trim()) { wrap.classList.add('is-invalid'); valid = false; }
                        }
                    });
                    if (!valid) {
                        msg.className = 'form-msg err';
                        msg.textContent = '请完成所有必填项';
                        return;
                    }

                    var fd = new FormData(form);
                    /* 已异步上传的文件不再重复提交，hidden 字段携带返回的 URL */
                    Array.prototype.forEach.call(form.querySelectorAll('input[type=file][data-uploaded]'), function (inp) {
                        fd.delete(inp.name);
                    });

                    if (!opts.action) {
                        var obj = {};
                        fd.forEach(function (v, k) {
                            if (Object.prototype.hasOwnProperty.call(obj, k)) {
                                if (Array.isArray(obj[k])) obj[k].push(v);
                                else obj[k] = [obj[k], v];
                            } else {
                                obj[k] = v;
                            }
                        });
                        msg.className = 'form-msg ok';
                        msg.textContent = '未配置提交地址，当前表单数据：' + JSON.stringify(obj);
                        return;
                    }

                    msg.className = 'form-msg';
                    msg.textContent = '提交中…';
                    fetch(opts.action, { method: 'POST', body: fd }).then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        msg.className = 'form-msg ok';
                        msg.textContent = '提交成功';
                    }).catch(function (err) {
                        msg.className = 'form-msg err';
                        msg.textContent = '提交失败：' + err.message;
                    });
                });
            }

            /* ================= 草稿自动保存 ================= */
            function saveDraft() {
                try {
                    localStorage.setItem(STORE_KEY, JSON.stringify({ form: formConf, fields: fields }));
                } catch (e) { }
            }

            function loadDraft() {
                try {
                    var raw = localStorage.getItem(STORE_KEY);
                    if (!raw) return;
                    var d = JSON.parse(raw);
                    if (d.form && typeof d.form === 'object') {
                        formConf.title = d.form.title || '未命名表单';
                        formConf.action = d.form.action || '';
                        formConf.submitText = d.form.submitText || '提交';
                    }
                    if (Array.isArray(d.fields)) {
                        /* 旧草稿兼容：选择类组件补充数据源默认配置 */
                        fields = d.fields;
                        fields.forEach(function (f) {
                            if (!f.props) return;
                            if (['select', 'radio', 'checkbox', 'cascade'].indexOf(f.type) >= 0) {
                                if (!f.props.dataSource) f.props.dataSource = 'static';
                                ['apiUrl', 'apiMethod', 'apiPath', 'labelField', 'valueField', 'childrenField'].forEach(function (k) {
                                    if (f.props[k] === undefined) f.props[k] = (k === 'apiMethod' ? 'GET' : '');
                                });
                            }
                        });
                    }
                } catch (e) { }
            }

            /* ================= 事件绑定 ================= */
            function bindEvents() {
                /* 组件面板：拖拽 + 点击添加 */
                paletteEl.addEventListener('dragstart', function (e) {
                    var item = e.target.closest('.pal-item');
                    if (!item) return;
                    dragData = { source: 'palette', type: item.dataset.type };
                    e.dataTransfer.setData('text/plain', 'add:' + item.dataset.type);
                    e.dataTransfer.effectAllowed = 'copy';
                    item.classList.add('pal-dragging');
                });

                paletteEl.addEventListener('dragend', function (e) {
                    var item = e.target.closest('.pal-item');
                    if (item) item.classList.remove('pal-dragging');
                    dragData = null;
                    lastPaletteDragEnd = Date.now();
                    clearIndicator();
                });

                paletteEl.addEventListener('click', function (e) {
                    if (Date.now() - lastPaletteDragEnd < 120) return;
                    var item = e.target.closest('.pal-item');
                    if (item) addField(item.dataset.type, fields.length);
                });

                /* 设计区：拖拽排序 / 放入 */
                listEl.addEventListener('dragstart', function (e) {
                    var cf = e.target.closest('.cf');
                    if (!cf) return;
                    dragData = { source: 'canvas', id: cf.dataset.id };
                    e.dataTransfer.setData('text/plain', 'move:' + cf.dataset.id);
                    e.dataTransfer.effectAllowed = 'move';
                    cf.classList.add('dragging');
                });

                listEl.addEventListener('dragend', function (e) {
                    var cf = e.target.closest('.cf');
                    if (cf) cf.classList.remove('dragging');
                    dragData = null;
                    clearIndicator();
                });

                listEl.addEventListener('dragover', function (e) {
                    if (!dragData) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = dragData.source === 'palette' ? 'copy' : 'move';
                    placeIndicator(computeIndex(e.clientY));
                });

                listEl.addEventListener('dragleave', function (e) {
                    if (!listEl.contains(e.relatedTarget)) clearIndicator();
                });

                listEl.addEventListener('drop', function (e) {
                    if (!dragData) return;
                    e.preventDefault();
                    var idx = dropIdx >= 0 ? dropIdx : computeIndex(e.clientY);
                    if (dragData.source === 'canvas') {
                        var from = fields.findIndex(function (f) { return f.id === dragData.id; });
                        if (from >= 0) {
                            var moved = fields.splice(from, 1)[0];
                            fields.splice(Math.min(idx, fields.length), 0, moved);
                        }
                    } else {
                        var nf = createField(dragData.type);
                        fields.splice(Math.min(idx, fields.length), 0, nf);
                        selectedId = nf.id;
                    }
                    dragData = null;
                    clearIndicator();
                    renderCanvas();
                    saveDraft();
                });

                /* 设计区：选中 / 设置 / 删除 */
                listEl.addEventListener('click', function (e) {
                    var cf = e.target.closest('.cf');
                    if (!cf) return;
                    var actEl = e.target.closest('[data-act]');
                    if (actEl && actEl.dataset.act === 'delete') {
                        deleteField(cf.dataset.id);
                        return;
                    }
                    if (actEl && actEl.dataset.act === 'setting') {
                        selectedId = cf.dataset.id;
                        renderCanvas();
                        openFieldSettings(cf.dataset.id);
                        return;
                    }
                    if (selectedId !== cf.dataset.id) {
                        selectedId = cf.dataset.id;
                        renderCanvas();
                    }
                });

                /* 点击设计区空白取消选中 */
                document.querySelector('.canvas-area').addEventListener('click', function (e) {
                    if (!e.target.closest('.cf')) {
                        if (selectedId) {
                            selectedId = null;
                            renderCanvas();
                        }
                    }
                });

                /* 字段设置弹窗：选项增删 / 数据源切换 / 接口测试 */
                $('settingsMask').addEventListener('click', function (e) {
                    /* 数据源 tab 切换 */
                    var tabBtn = e.target.closest('[data-act="ds-tab"]');
                    if (tabBtn) {
                        var dsBox = tabBtn.closest('[data-ds-box]');
                        var tab = tabBtn.getAttribute('data-tab');
                        dsBox.querySelectorAll('.ds-tab').forEach(function (b) {
                            b.classList.toggle('is-active', b === tabBtn);
                        });
                        dsBox.querySelectorAll('.ds-panel').forEach(function (pnl) {
                            pnl.hidden = pnl.getAttribute('data-panel') !== tab;
                        });
                        dsBox.querySelector('[data-key="dataSource"]').value = tab;
                        return;
                    }

                    /* 测试接口 */
                    var testBtn = e.target.closest('[data-act="test-api"]');
                    if (testBtn) {
                        testDatasourceApi(testBtn.closest('[data-ds-box]'), testBtn);
                        return;
                    }

                    var addBtn = e.target.closest('[data-act="add-opt"]');
                    if (addBtn) {
                        var box = $('settingsBody').querySelector('[data-options-box]');
                        var count = box.querySelectorAll('.opt-row').length;
                        var row = document.createElement('div');
                        row.className = 'opt-row';
                        row.innerHTML = optionRowHtml({ label: '', value: String(count + 1) });
                        box.insertBefore(row, addBtn.parentElement === box ? addBtn : addBtn);
                        var firstInput = row.querySelector('.opt-label');
                        firstInput.focus();
                        return;
                    }
                    var delBtn = e.target.closest('.opt-del');
                    if (delBtn) {
                        delBtn.closest('.opt-row').remove();
                    }
                });

                $('btnSaveSettings').addEventListener('click', saveFieldSettings);
                $('btnSaveForm').addEventListener('click', saveFormSettings);
                $('btnFormSettings').addEventListener('click', openFormSettings);
                $('btnPreview').addEventListener('click', openPreview);
                $('btnExport').addEventListener('click', exportHtml);

                $('btnClear').addEventListener('click', function () {
                    confirmBox('清空设计区', '确定要清空所有组件吗？此操作不可恢复。').then(function (ok) {
                        if (!ok) return;
                        fields = [];
                        selectedId = null;
                        renderCanvas();
                        saveDraft();
                        toast('已清空');
                    });
                });

                /* 弹窗：遮罩点击 / 关闭按钮 / ESC */
                document.querySelectorAll('.modal-mask').forEach(function (mask) {
                    mask.querySelectorAll('[data-close]').forEach(function (btn) {
                        btn.addEventListener('click', function () {
                            mask.classList.remove('show');
                            mask.dispatchEvent(new Event('mclose'));
                        });
                    });
                });

                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') closeTopMask();
                });
            }

            /* ================= 初始化 ================= */
            function init() {
                $('brandSvg').innerHTML = icon('pencil');
                loadDraft();
                renderPalette();
                renderCanvas();
                bindEvents();
            }

            init();
        })();
    </script>
</body>
