<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-2: #f7f7f8;
            --text: #1f1f1f;
            --muted: #767676;
            --border: #e6e6e6;
            --hover: #f2f2f2;
            --active: #e9e9e9;
            --select: #e5f0fb;
            --select-border: #cadff5;
            --accent: #0a6ed1;
            --scroll: #c4c4c4;
        }
        [data-theme="dark"] {
            --bg: #1b1b1d;
            --surface: #232326;
            --surface-2: #2b2b2f;
            --text: #e8e8e8;
            --muted: #9a9a9a;
            --border: #35353b;
            --hover: #2d2d32;
            --active: #383840;
            --select: #14395c;
            --select-border: #1e5386;
            --accent: #4aa3ff;
            --scroll: #4c4c55;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
        }
        .explorer {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--surface);
        }
        /* 工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }
        .icon-btn:hover:not(:disabled) {
            background: var(--hover);
        }
        .icon-btn:active:not(:disabled) {
            background: var(--active);
        }
        .icon-btn:disabled {
            opacity: 0.32;
            cursor: default;
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
        }
        .divider {
            width: 1px;
            height: 18px;
            margin: 0 6px;
            background: var(--border);
            flex-shrink: 0;
        }
        /* 路径面包屑 */
        .crumbs {
            display: flex;
            align-items: center;
            gap: 1px;
            flex: 1;
            min-width: 0;
            padding: 2px 4px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface-2);
            overflow: hidden;
        }
        .crumb {
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
        }
        .crumb:hover {
            background: var(--hover);
        }
        .crumb.current {
            font-weight: 600;
            cursor: default;
        }
        .crumb.current:hover {
            background: transparent;
        }
        .sep {
            color: var(--muted);
            flex-shrink: 0;
        }
        /* 内容区 */
        .content {
            flex: 1;
            padding: 12px;
            overflow: auto;
        }
        .content::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .content::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 8px;
            background-clip: content-box;
            background-color: var(--scroll);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
            gap: 4px;
        }
        .cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            padding: 12px 6px;
            border: 1px solid transparent;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background: var(--hover);
        }
        .cell.selected {
            background: var(--select);
            border-color: var(--select-border);
        }
        .cell .ic {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
        }
        .cell .nm {
            max-width: 100%;
            font-size: 12px;
            line-height: 1.35;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .list .row {
            display: grid;
            grid-template-columns: 24px minmax(0, 1fr) 110px 86px 148px;
            align-items: center;
            gap: 12px;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .list .row:hover {
            background: var(--hover);
        }
        .list .row.selected {
            background: var(--select);
        }
        .list .row.head {
            padding-bottom: 8px;
            margin-bottom: 2px;
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            color: var(--muted);
            font-size: 12px;
            cursor: default;
        }
        .list .row.head:hover {
            background: transparent;
        }
        .list .ic {
            width: 20px;
            height: 20px;
        }
        .list .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .list .meta {
            color: var(--muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        svg {
            display: block;
        }
        .ic svg {
            width: 100%;
            height: 100%;
        }
        /* 空状态 */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 100%;
            color: var(--muted);
        }
        .empty .ic {
            width: 72px;
            height: 72px;
            opacity: 0.5;
        }
        /* 状态栏 */
        .statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 14px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            flex-shrink: 0;
        }
        /* 提示 */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 44px;
            padding: 9px 18px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.82);
            color: #fff;
            font-size: 13px;
            opacity: 0;
            transform: translateX(-50%) translateY(16px);
            transition: opacity 0.22s, transform 0.22s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @media (max-width: 720px) {
            .list .row {
                grid-template-columns: 24px minmax(0, 1fr) 90px;
            }
            .list .row .meta:nth-of-type(3),
            .list .row .meta:nth-of-type(4) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="explorer">
        <div class="toolbar">
            <button class="icon-btn" id="btnBack" title="后退">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="icon-btn" id="btnForward" title="前进">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
            </button>
            <button class="icon-btn" id="btnUp" title="上一级">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
            </button>
            <button class="icon-btn" id="btnRefresh" title="刷新">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 3v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M6 21v-4h4"/></svg>
            </button>
            <div class="divider"></div>
            <div class="crumbs" id="crumbs"></div>
            <div class="divider"></div>
            <button class="icon-btn" id="btnView" title="切换视图"></button>
            <button class="icon-btn" id="btnTheme" title="切换主题"></button>
        </div>
        <div class="content" id="content"></div>
        <div class="statusbar">
            <span id="statusLeft"></span>
            <span id="statusRight"></span>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        /* ===== 数据模型 ===== */
        const file = (name, size, date) => ({ name, size, date, type: "file" });
        const folder = (name, children) => ({ name, children, type: "folder" });

        const ROOT = folder("此电脑", [
            folder("文档", [
                file("项目计划.docx", "128 KB", "2026-09-12 09:40"),
                file("年度预算.xlsx", "512 KB", "2026-09-18 14:12"),
                file("产品发布会.pptx", "8.6 MB", "2026-08-30 16:05"),
                file("会议纪要.txt", "12 KB", "2026-09-20 11:30"),
                file("合同扫描件.pdf", "1.2 MB", "2026-07-15 10:02"),
                folder("归档", [
                    file("2025年度报告.pdf", "3.4 MB", "2025-12-28 17:20"),
                    file("旧版宣传片.mp4", "92 MB", "2025-11-06 13:15")
                ])
            ]),
            folder("图片", [
                file("风景照片.jpg", "3.1 MB", "2026-06-11 18:22"),
                file("团队合影.png", "2.4 MB", "2026-06-18 09:15"),
                file("品牌图标.svg", "18 KB", "2026-05-02 13:44"),
                file("界面截图.webp", "640 KB", "2026-09-25 15:36")
            ]),
            folder("视频", [
                file("产品宣传片.mp4", "156 MB", "2026-08-05 20:10"),
                file("操作教程.mov", "88 MB", "2026-08-22 17:48")
            ]),
            folder("音乐", [
                file("背景音乐.mp3", "5.2 MB", "2026-04-14 22:05"),
                file("现场录音.wav", "24 MB", "2026-09-01 10:33")
            ]),
            folder("下载", [
                file("源码备份.zip", "32 MB", "2026-09-27 08:19"),
                file("安装程序.exe", "64 MB", "2026-09-10 12:00"),
                file("移动端应用.apk", "48 MB", "2026-09-11 19:26")
            ]),
            folder("项目", [
                file("index.html", "4 KB", "2026-09-26 09:05"),
                file("main.js", "26 KB", "2026-09-26 09:06"),
                file("styles.css", "8 KB", "2026-09-26 09:07"),
                file("config.json", "2 KB", "2026-09-26 09:08"),
                file("data.py", "6 KB", "2026-09-24 15:41"),
                file("README.md", "3 KB", "2026-09-26 10:12")
            ]),
            file("待办清单.md", "2 KB", "2026-09-28 08:30"),
            file("桌面壁纸.jpg", "1.8 MB", "2026-03-19 21:14"),
            file("未命名文件", "0 B", "2026-09-29 09:00")
        ]);

        /* ===== 图标 ===== */
        const FOLDER_ICON = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.5 7a2 2 0 0 1 2-2h4.3l1.8 2H19.5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="#d99b27"/>
            <path d="M2.5 9.5H21.5V18a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z" fill="#f7c948"/>
        </svg>`;

        const page = (fill, inner) => `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3.5A1.5 1.5 0 0 1 6.5 2h7.2L19 7.3v13.2A1.5 1.5 0 0 1 17.5 22h-11A1.5 1.5 0 0 1 5 20.5z" fill="${fill}"/>
            <path d="M13.7 2L19 7.3h-4.3a1 1 0 0 1-1-1z" fill="#ffffff" opacity=".42"/>
            ${inner}
        </svg>`;

        const label = (text, size) => `<text x="12" y="16.2" font-family="Segoe UI, Arial, sans-serif" font-size="${size || 5.4}" font-weight="700" letter-spacing=".2" fill="#ffffff" text-anchor="middle">${text}</text>`;

        const GLYPH = {
            image: `<circle cx="10" cy="12.6" r="1.3" fill="#fff"/><path d="M7 18.6l3.1-3.6 2.1 2.2 1.7-1.9 2.9 3.3z" fill="#fff"/>`,
            video: `<path d="M10 11.4l5.6 3.2-5.6 3.2z" fill="#fff"/>`,
            audio: `<circle cx="11.2" cy="17.5" r="1.6" fill="#fff"/><circle cx="16.2" cy="16.1" r="1.6" fill="#fff"/><path d="M11.2 17.5V10.8l5-1.4v6.7" stroke="#fff" stroke-width="1.3" fill="none"/>`,
            lines: `<path d="M8 12.6h8M8 15.4h8M8 18.2h5.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>`,
            code: `<path d="M10.6 11.8L8.2 14.4l2.4 2.6M13.4 11.8l2.4 2.6-2.4 2.6M12.9 10.8l-1.8 7.2" stroke="#fff" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
        };

        const EXT_GROUPS = {
            image: ["jpg", "jpeg", "png", "gif", "bmp", "webp", "svg", "ico", "heic"],
            video: ["mp4", "mov", "avi", "mkv", "flv", "wmv"],
            audio: ["mp3", "wav", "flac", "aac", "ogg", "m4a"],
            pdf: ["pdf"],
            word: ["doc", "docx", "rtf"],
            excel: ["xls", "xlsx", "csv"],
            ppt: ["ppt", "pptx"],
            text: ["txt", "log", "ini", "conf"],
            markdown: ["md", "markdown"],
            code: ["js", "ts", "jsx", "tsx", "html", "css", "scss", "json", "py", "java", "c", "cpp", "go", "rs", "php", "sh", "xml", "yml", "yaml", "vue", "sql"],
            archive: ["zip", "rar", "7z", "tar", "gz", "iso"],
            app: ["exe", "apk", "msi", "dmg", "deb", "rpm", "bat"]
        };

        const KIND_BY_EXT = {};
        Object.keys(EXT_GROUPS).forEach(kind => EXT_GROUPS[kind].forEach(ext => { KIND_BY_EXT[ext] = kind; }));

        const KIND_LABEL = {
            folder: "文件夹",
            image: "图像文件",
            video: "视频文件",
            audio: "音频文件",
            pdf: "PDF 文档",
            word: "Word 文档",
            excel: "Excel 表格",
            ppt: "PowerPoint 演示文稿",
            text: "文本文档",
            markdown: "Markdown 文档",
            code: "源代码文件",
            archive: "压缩文件",
            app: "应用程序",
            plain: "文件"
        };

        const COLOR = {
            pdf: "#e0393e",
            word: "#2b579a",
            excel: "#217346",
            ppt: "#d24726",
            archive: "#b07c1e",
            app: "#54606b",
            image: "#2f9e44",
            video: "#7048e8",
            audio: "#d6336c",
            text: "#868e96",
            markdown: "#495057",
            code: "#3b5bdb",
            plain: "#adb5bd"
        };

        function extOf(node) {
            const i = node.name.lastIndexOf(".");
            return i > 0 ? node.name.slice(i + 1).toLowerCase() : "";
        }

        function kindOf(node) {
            if (node.type === "folder") return "folder";
            return KIND_BY_EXT[extOf(node)] || "plain";
        }

        function iconFor(node) {
            if (node.type === "folder") return FOLDER_ICON;
            const kind = kindOf(node);
            const ext = extOf(node);
            switch (kind) {
                case "pdf": return page(COLOR.pdf, label("PDF"));
                case "word": return page(COLOR.word, label("DOC"));
                case "excel": return page(COLOR.excel, label("XLS"));
                case "ppt": return page(COLOR.ppt, label("PPT"));
                case "archive": return page(COLOR.archive, label(ext.slice(0, 3).toUpperCase()));
                case "app": return page(COLOR.app, label(ext.slice(0, 3).toUpperCase()));
                case "image": return page(COLOR.image, GLYPH.image);
                case "video": return page(COLOR.video, GLYPH.video);
                case "audio": return page(COLOR.audio, GLYPH.audio);
                case "code": return page(COLOR.code, GLYPH.code);
                case "text": return page(COLOR.text, GLYPH.lines);
                case "markdown": return page(COLOR.markdown, GLYPH.lines);
                default: return page(COLOR.plain, ext ? label(ext.slice(0, 3).toUpperCase()) : GLYPH.lines);
            }
        }

        /* ===== 状态 ===== */
        const contentEl = document.getElementById("content");
        const crumbsEl = document.getElementById("crumbs");
        const statusLeft = document.getElementById("statusLeft");
        const statusRight = document.getElementById("statusRight");
        const toastEl = document.getElementById("toast");
        const btnBack = document.getElementById("btnBack");
        const btnForward = document.getElementById("btnForward");
        const btnUp = document.getElementById("btnUp");
        const btnRefresh = document.getElementById("btnRefresh");
        const btnView = document.getElementById("btnView");
        const btnTheme = document.getElementById("btnTheme");

        let path = [ROOT];
        let history = [[ROOT]];
        let historyIndex = 0;
        let currentNode = null;
        let currentItems = [];
        let selected = null;
        let viewMode = "grid";

        /* ===== 工具函数 ===== */
        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        }

        let toastTimer = null;
        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
        }

        /* ===== 渲染 ===== */
        function renderCrumbs() {
            crumbsEl.innerHTML = path.map((node, i) => {
                const isLast = i === path.length - 1;
                const prefix = i ? '<span class="sep">›</span>' : "";
                return prefix + `<span class="crumb${isLast ? " current" : ""}" data-i="${i}">${escapeHtml(node.name)}</span>`;
            }).join("");
        }

        function renderItems() {
            if (!currentItems.length) {
                contentEl.innerHTML = `<div class="empty"><div class="ic">${FOLDER_ICON}</div><div>此文件夹为空</div></div>`;
                return;
            }
            if (viewMode === "grid") {
                contentEl.innerHTML = `<div class="grid">${currentItems.map((node, i) => `
                    <div class="cell" data-i="${i}" title="${escapeHtml(node.name)}">
                        <div class="ic">${iconFor(node)}</div>
                        <div class="nm">${escapeHtml(node.name)}</div>
                    </div>`).join("")}</div>`;
            } else {
                contentEl.innerHTML = `<div class="list">
                    <div class="row head">
                        <span class="ic"></span>
                        <span class="name">名称</span>
                        <span class="meta">类型</span>
                        <span class="meta">大小</span>
                        <span class="meta">修改日期</span>
                    </div>
                    ${currentItems.map((node, i) => `
                    <div class="row" data-i="${i}">
                        <span class="ic">${iconFor(node)}</span>
                        <span class="name" title="${escapeHtml(node.name)}">${escapeHtml(node.name)}</span>
                        <span class="meta">${KIND_LABEL[kindOf(node)]}</span>
                        <span class="meta">${node.type === "folder" ? "—" : node.size}</span>
                        <span class="meta">${node.type === "folder" ? "—" : node.date}</span>
                    </div>`).join("")}
                </div>`;
            }
        }

        function updateStatus() {
            statusLeft.textContent = `${currentItems.length} 个项目`;
            if (!selected) {
                statusRight.textContent = "";
                return;
            }
            const kind = kindOf(selected);
            statusRight.textContent = kind === "folder"
                ? KIND_LABEL.folder
                : KIND_LABEL[kind] + (selected.size ? " · " + selected.size : "");
        }

        function renderButtons() {
            btnBack.disabled = historyIndex <= 0;
            btnForward.disabled = historyIndex >= history.length - 1;
            btnUp.disabled = path.length <= 1;
            btnView.innerHTML = viewMode === "grid"
                ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="4" height="4" rx="1"/><rect x="9" y="5" width="12" height="2" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="3" y="16" width="4" height="4" rx="1"/><rect x="9" y="17" width="12" height="2" rx="1"/></svg>`
                : `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>`;
            btnView.title = viewMode === "grid" ? "切换到列表视图" : "切换到图标视图";
            btnTheme.innerHTML = document.documentElement.dataset.theme === "dark"
                ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>`
                : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>`;
            btnTheme.title = document.documentElement.dataset.theme === "dark" ? "切换到浅色主题" : "切换到深色主题";
        }

        function render() {
            currentNode = path[path.length - 1];
            currentItems = (currentNode.children || []).slice().sort((a, b) => {
                if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
                return a.name.localeCompare(b.name, "zh-Hans-CN");
            });
            selected = null;
            lastClickIndex = -1;
            renderCrumbs();
            renderItems();
            renderButtons();
            updateStatus();
        }

        /* ===== 导航 ===== */
        function goTo(newPath) {
            path = newPath;
            history = history.slice(0, historyIndex + 1);
            history.push(newPath);
            historyIndex = history.length - 1;
            render();
        }

        function goBack() {
            if (historyIndex <= 0) return;
            historyIndex--;
            path = history[historyIndex];
            render();
        }

        function goForward() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            path = history[historyIndex];
            render();
        }

        function goUp() {
            if (path.length > 1) goTo(path.slice(0, -1));
        }

        function openNode(node) {
            if (!node) return;
            if (node.type === "folder") {
                goTo(path.concat(node));
            } else {
                toast("打开文件：" + node.name);
            }
        }

        /* ===== 选择 ===== */
        function selectByIndex(index) {
            selected = currentItems[index];
            const nodes = contentEl.querySelectorAll("[data-i]");
            nodes.forEach(el => {
                el.classList.toggle("selected", Number(el.dataset.i) === index);
            });
            updateStatus();
        }

        function clearSelection() {
            selected = null;
            contentEl.querySelectorAll(".selected").forEach(el => el.classList.remove("selected"));
            updateStatus();
        }

        /* ===== 事件绑定 ===== */
        crumbsEl.addEventListener("click", e => {
            const crumb = e.target.closest(".crumb");
            if (!crumb || crumb.classList.contains("current")) return;
            goTo(path.slice(0, Number(crumb.dataset.i) + 1));
        });

        let lastClickIndex = -1;
        let lastClickTime = 0;

        contentEl.addEventListener("click", e => {
            const item = e.target.closest("[data-i]");
            if (!item) {
                clearSelection();
                lastClickIndex = -1;
                return;
            }
            const index = Number(item.dataset.i);
            const now = Date.now();
            selectByIndex(index);
            if (index === lastClickIndex && now - lastClickTime < 500) {
                lastClickIndex = -1;
                openNode(currentItems[index]);
            } else {
                lastClickIndex = index;
                lastClickTime = now;
            }
        });

        btnBack.addEventListener("click", goBack);
        btnForward.addEventListener("click", goForward);
        btnUp.addEventListener("click", goUp);
        btnRefresh.addEventListener("click", () => {
            render();
            toast("已刷新");
        });
        btnView.addEventListener("click", () => {
            viewMode = viewMode === "grid" ? "list" : "grid";
            renderItems();
            renderButtons();
            if (selected) selectByIndex(currentItems.indexOf(selected));
            updateStatus();
        });
        btnTheme.addEventListener("click", () => {
            const dark = document.documentElement.dataset.theme === "dark";
            document.documentElement.dataset.theme = dark ? "light" : "dark";
            try {
                localStorage.setItem("explorer-theme", dark ? "light" : "dark");
            } catch (err) {
                /* 忽略存储异常 */
            }
            renderButtons();
        });

        /* ===== 初始化 ===== */
        try {
            const saved = localStorage.getItem("explorer-theme");
            if (saved) document.documentElement.dataset.theme = saved;
        } catch (err) {
            /* 忽略存储异常 */
        }
        render();
    </script>
</body>
</html>
