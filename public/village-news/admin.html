<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电子报内容管理</title>
    <style>
        :root {
            --paper: #f7f3ea;
            --card: #fffdf7;
            --ink: #2c2420;
            --ink-soft: #6b6157;
            --line: #d8cfbf;
            --red: #b03a2e;
            --red-soft: #f7e8e5;
            --green: #3d7a4f;
            --shadow: 0 2px 10px rgba(60, 45, 30, .08);
        }
        :root[data-theme="dark"] {
            --paper: #171310;
            --card: #211c16;
            --ink: #e9e1d3;
            --ink-soft: #a89b89;
            --line: #3b332a;
            --red: #e0705a;
            --red-soft: #3a2622;
            --green: #7db98a;
            --shadow: 0 2px 10px rgba(0, 0, 0, .4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--paper); color: var(--ink);
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
            line-height: 1.6; transition: background .3s, color .3s;
        }
        .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif; }
        .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 60px; }

        header.top {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; padding-bottom: 14px; border-bottom: 3px double var(--red); margin-bottom: 18px;
        }
        header.top h1 { font-size: 24px; letter-spacing: .08em; }
        header.top h1 small { font-size: 12px; color: var(--ink-soft); font-weight: 400; margin-left: 10px; }
        .top-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .top-right a, .theme-btn, .btn {
            font-size: 13px; text-decoration: none; color: var(--ink);
            border: 1px solid var(--line); background: var(--card); border-radius: 6px;
            padding: 6px 14px; cursor: pointer; transition: all .25s;
        }
        .top-right a:hover, .btn:hover { border-color: var(--red); color: var(--red); }
        .theme-btn svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
        :root[data-theme="dark"] .icon-sun { display: none; }
        :root:not([data-theme="dark"]) .icon-moon { display: none; }

        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap;
            background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
            padding: 12px 14px; margin-bottom: 18px; align-items: center;
        }
        .btn-primary { background: var(--red); color: #fff; border-color: var(--red); font-weight: 700; }
        .btn-primary:hover { filter: brightness(1.08); color: #fff; }
        .toolbar .hint { font-size: 12px; color: var(--ink-soft); margin-left: auto; }

        .layout { display: grid; grid-template-columns: 1fr 380px; gap: 18px; align-items: start; }

        fieldset.block {
            background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
            padding: 16px 18px 18px; margin-bottom: 18px;
        }
        fieldset.block > legend {
            font-size: 17px; font-weight: 900; letter-spacing: .08em; padding: 0 10px;
            border-left: 4px solid var(--red);
        }
        fieldset.block > legend .no { color: var(--red); font-size: 12px; margin-right: 6px; }
        .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
        .fgrid label { display: block; font-size: 13px; color: var(--ink-soft); }
        .fgrid label.full { grid-column: 1 / -1; }
        .fgrid input, .fgrid textarea, .json-box textarea {
            width: 100%; margin-top: 4px; padding: 7px 10px; font-size: 14px; font-family: inherit;
            border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 4px;
        }
        .fgrid textarea { resize: vertical; min-height: 80px; }
        .fgrid input:focus, .fgrid textarea:focus, .json-box textarea:focus { outline: none; border-color: var(--red); }

        .items { margin-top: 12px; }
        .item {
            border: 1px dashed var(--line); border-radius: 6px;
            padding: 10px 12px 12px; margin-bottom: 10px; position: relative; background: var(--paper);
        }
        .item legend { font-size: 12px; color: var(--ink-soft); padding: 0 6px; }
        .item .del {
            position: absolute; top: 8px; right: 10px; font-size: 12px;
            border: none; background: none; color: var(--red); cursor: pointer;
        }
        .item .del:hover { text-decoration: underline; }
        .add-btn {
            width: 100%; padding: 8px; font-size: 13px; cursor: pointer;
            border: 1px dashed var(--line); background: none; color: var(--ink-soft); border-radius: 6px;
        }
        .add-btn:hover { border-color: var(--red); color: var(--red); }

        .json-box {
            background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
            padding: 14px 16px 16px; position: sticky; top: 16px;
        }
        .json-box h3 { font-size: 15px; margin-bottom: 4px; }
        .json-box p { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
        .json-box textarea {
            font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.5;
            min-height: 420px; resize: vertical; white-space: pre;
        }

        .toast {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
            background: var(--ink); color: var(--paper); font-size: 13px;
            padding: 9px 20px; border-radius: 20px; opacity: 0; pointer-events: none;
            transition: all .3s; z-index: 99;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 1020px) {
            .layout { grid-template-columns: 1fr; }
            .json-box { position: static; }
            .json-box textarea { min-height: 240px; }
        }
        @media (max-width: 620px) {
            .fgrid { grid-template-columns: 1fr; }
            header.top h1 { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="top">
            <h1 class="serif">电子报内容管理<small>编辑完成后导出 data.json 替换站点文件</small></h1>
            <div class="top-right">
                <a href="index.html" target="_blank">打开报纸页</a>
                <button class="theme-btn" id="themeBtn" type="button">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    切换主题
                </button>
            </div>
        </header>

        <div class="toolbar">
            <button class="btn btn-primary" id="btnDownload" type="button">下载 data.json</button>
            <button class="btn" id="btnCopy" type="button">复制 JSON</button>
            <button class="btn" id="btnApply" type="button">应用右侧 JSON</button>
            <label class="btn" style="display:inline-block;">导入 JSON 文件<input type="file" id="fileInput" accept=".json,application/json" hidden></label>
            <button class="btn" id="btnOnline" type="button">载入线上 data.json</button>
            <button class="btn" id="btnClear" type="button">清空本地草稿</button>
            <span class="hint">编辑内容会自动存为本地草稿</span>
        </div>

        <div class="layout">
            <div class="forms">
                <fieldset class="block">
                    <legend><span class="no">报头</span>基础信息</legend>
                    <div class="fgrid">
                        <label>报纸名称<input id="m-name"></label>
                        <label>主办单位<input id="m-publisher"></label>
                        <label>天气<input id="m-weather"></label>
                        <label>出版说明<input id="m-note" placeholder="例：逢周五出版 · 免费阅读"></label>
                        <label>创刊日期（用于自动计算期号）<input id="m-start" placeholder="2025-01-03"></label>
                    </div>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">01</span>大事件 · 头版头条</legend>
                    <div class="fgrid">
                        <label>角标文字<input id="h-kicker" placeholder="头版头条"></label>
                        <label>阅读次数<input id="h-views" inputmode="numeric"></label>
                        <label class="full">头条标题<input id="h-title"></label>
                        <label class="full">配图 URL<input id="h-image"></label>
                        <label class="full">正文段落（每行一段）<textarea id="h-paragraphs"></textarea></label>
                        <label class="full">署名 / 来源<input id="h-author"></label>
                    </div>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">02</span>新鲜事 · 短讯</legend>
                    <div class="items" id="list-fresh"></div>
                    <button class="add-btn" type="button" data-add="fresh">＋ 添加一条短讯</button>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">03</span>新店开张</legend>
                    <div class="items" id="list-shops"></div>
                    <button class="add-btn" type="button" data-add="shops">＋ 添加一家店铺</button>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">04</span>招工</legend>
                    <div class="items" id="list-jobs"></div>
                    <button class="add-btn" type="button" data-add="jobs">＋ 添加一个岗位</button>
                    <div class="fgrid" style="margin-top:12px;">
                        <label class="full">招工提示语（绿色安全提示）<input id="m-jobnote"></label>
                    </div>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">05</span>婚介</legend>
                    <div class="items" id="list-matches"></div>
                    <button class="add-btn" type="button" data-add="matches">＋ 添加一条征婚</button>
                    <div class="fgrid" style="margin-top:12px;">
                        <label class="full">婚介备注（见面会 / 红娘热线）<input id="m-matchnote"></label>
                    </div>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">06</span>投稿 · 读者来信</legend>
                    <div class="fgrid">
                        <label class="full">来信内容<textarea id="l-text"></textarea></label>
                        <label>来信署名<input id="l-from"></label>
                    </div>
                </fieldset>

                <fieldset class="block">
                    <legend><span class="no">页脚</span>页脚信息</legend>
                    <div class="fgrid">
                        <label>宣传语<input id="f-slogan"></label>
                        <label>主办 / 协办<input id="f-organizer"></label>
                        <label class="full">版权声明<input id="f-copyright"></label>
                    </div>
                </fieldset>
            </div>

            <aside class="json-box">
                <h3 class="serif">JSON 预览 / 导入</h3>
                <p>可直接编辑右侧 JSON 后点击「应用右侧 JSON」；也可粘贴整份 data.json 内容导入。</p>
                <textarea id="jsonBox" spellcheck="false"></textarea>
            </aside>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ---------- 主题 ---------- */
        var root = document.documentElement;
        if (localStorage.getItem("vn-theme") === "dark") root.dataset.theme = "dark";
        document.getElementById("themeBtn").addEventListener("click", function () {
            var dark = root.dataset.theme !== "dark";
            if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
            localStorage.setItem("vn-theme", dark ? "dark" : "light");
        });

        /* ---------- 动态列表定义 ---------- */
        var SCHEMA = {
            fresh: [
                { k: "date", l: "日期", ph: "10-18" },
                { k: "text", l: "内容", ph: "一句话短讯" }
            ],
            shops: [
                { k: "name", l: "店名" },
                { k: "badge", l: "角标", ph: "本周开业" },
                { k: "desc", l: "简介" },
                { k: "offer", l: "优惠 / 地址" },
                { k: "image", l: "图片 URL" }
            ],
            jobs: [
                { k: "title", l: "岗位" },
                { k: "count", l: "人数", num: true },
                { k: "pay", l: "薪资", ph: "180元/天" },
                { k: "desc", l: "工作说明" },
                { k: "contact", l: "联系人" }
            ],
            matches: [
                { k: "num", l: "编号", ph: "缘001" },
                { k: "name", l: "姓名" },
                { k: "age", l: "年龄", num: true },
                { k: "desc", l: "简介" }
            ]
        };
        var NUM_KEYS = ["count", "age"];

        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
        }

        function itemHTML(list, val) {
            val = val || {};
            var fields = SCHEMA[list].map(function (f) {
                var v = val[f.k] == null ? "" : esc(val[f.k]);
                return '<label>' + f.l + '<input data-k="' + f.k + '" value="' + v + '" placeholder="' + (f.ph || "") + '"></label>';
            }).join("");
            return '<fieldset class="item"><legend>条目</legend>' +
                '<button type="button" class="del" data-del>删除</button>' +
                '<div class="fgrid">' + fields + "</div></fieldset>";
        }

        document.addEventListener("click", function (e) {
            if (e.target.dataset && e.target.dataset.del !== undefined) {
                e.target.closest(".item").remove();
                syncJSON();
            }
            if (e.target.dataset && e.target.dataset.add) {
                addItem(e.target.dataset.add);
                syncJSON();
            }
        });

        function addItem(list, val) {
            document.getElementById("list-" + list).insertAdjacentHTML("beforeend", itemHTML(list, val));
        }

        /* ---------- 表单 <-> 数据 ---------- */
        function val(id) { return document.getElementById(id).value.trim(); }
        function setVal(id, v) { document.getElementById(id).value = v == null ? "" : v; }

        function buildData() {
            return {
                meta: {
                    name: val("m-name"), publisher: val("m-publisher"),
                    weather: val("m-weather"), note: val("m-note"), startDate: val("m-start")
                },
                headline: {
                    kicker: val("h-kicker"), title: val("h-title"), image: val("h-image"),
                    paragraphs: document.getElementById("h-paragraphs").value.split(/\n+/).filter(function (s) { return s.trim(); }),
                    author: val("h-author"), views: Number(val("h-views")) || 0
                },
                fresh: collectList("fresh"),
                shops: collectList("shops"),
                jobs: collectList("jobs"),
                jobNote: val("m-jobnote"),
                matches: collectList("matches"),
                matchNote: val("m-matchnote"),
                letter: { text: document.getElementById("l-text").value.trim(), from: val("l-from") },
                footer: { slogan: val("f-slogan"), organizer: val("f-organizer"), copyright: val("f-copyright") }
            };
        }

        function collectList(list) {
            var out = [];
            document.querySelectorAll("#list-" + list + " .item").forEach(function (item) {
                var obj = {};
                item.querySelectorAll("[data-k]").forEach(function (inp) {
                    var k = inp.dataset.k;
                    obj[k] = NUM_KEYS.indexOf(k) > -1 ? (Number(inp.value) || 0) : inp.value.trim();
                });
                out.push(obj);
            });
            return out;
        }

        function applyData(d) {
            setVal("m-name", d.meta && d.meta.name);
            setVal("m-publisher", d.meta && d.meta.publisher);
            setVal("m-weather", d.meta && d.meta.weather);
            setVal("m-note", d.meta && d.meta.note);
            setVal("m-start", d.meta && d.meta.startDate);

            var h = d.headline || {};
            setVal("h-kicker", h.kicker); setVal("h-title", h.title);
            setVal("h-image", h.image); setVal("h-paragraphs", (h.paragraphs || []).join("\n"));
            setVal("h-author", h.author); setVal("h-views", h.views || "");

            ["fresh", "shops", "jobs", "matches"].forEach(function (k) {
                var box = document.getElementById("list-" + k);
                box.innerHTML = "";
                (d[k] || []).forEach(function (v) { addItem(k, v); });
            });

            setVal("m-jobnote", d.jobNote);
            setVal("m-matchnote", d.matchNote);
            var l = d.letter || {};
            setVal("l-text", l.text); setVal("l-from", l.from);
            var f = d.footer || {};
            setVal("f-slogan", f.slogan); setVal("f-organizer", f.organizer); setVal("f-copyright", f.copyright);
            syncJSON();
        }

        /* ---------- JSON 同步 / 草稿 ---------- */
        var jsonBox = document.getElementById("jsonBox");
        var saveTimer = null;
        function syncJSON() {
            var text = JSON.stringify(buildData(), null, 4);
            if (document.activeElement !== jsonBox) jsonBox.value = text;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () {
                localStorage.setItem("vn-draft", text);
            }, 400);
        }
        document.addEventListener("input", syncJSON);

        /* ---------- 提示 ---------- */
        var toastTimer = null;
        function toast(msg) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
        }

        /* ---------- 工具栏 ---------- */
        document.getElementById("btnDownload").addEventListener("click", function () {
            var blob = new Blob([JSON.stringify(buildData(), null, 4)], { type: "application/json" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "data.json";
            a.click();
            URL.revokeObjectURL(a.href);
            toast("已下载 data.json，请替换站点目录中的同名文件");
        });

        document.getElementById("btnCopy").addEventListener("click", function () {
            var text = JSON.stringify(buildData(), null, 4);
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () { toast("JSON 已复制到剪贴板"); }, function () { toast("复制失败，请手动选择文本复制"); });
            } else {
                jsonBox.select();
                document.execCommand("copy");
                toast("JSON 已复制到剪贴板");
            }
        });

        document.getElementById("btnApply").addEventListener("click", function () {
            try {
                applyData(JSON.parse(jsonBox.value));
                toast("JSON 已应用到表单");
            } catch (e) {
                toast("JSON 格式有误：" + e.message);
            }
        });

        document.getElementById("fileInput").addEventListener("change", function () {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function () {
                try {
                    applyData(JSON.parse(reader.result));
                    toast("已导入：" + file.name);
                } catch (e) {
                    toast("文件不是有效的 JSON：" + e.message);
                }
            };
            reader.readAsText(file);
            this.value = "";
        });

        document.getElementById("btnOnline").addEventListener("click", function () {
            fetch("data.json", { cache: "no-store" })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(function (d) { applyData(d); toast("已载入线上 data.json"); })
                .catch(function () { toast("载入失败，请确认 data.json 存在"); });
        });

        document.getElementById("btnClear").addEventListener("click", function () {
            localStorage.removeItem("vn-draft");
            toast("本地草稿已清空");
        });

        /* ---------- 初始化：优先本地草稿，其次线上数据 ---------- */
        var draft = localStorage.getItem("vn-draft");
        if (draft) {
            try {
                applyData(JSON.parse(draft));
                toast("已恢复上次编辑的本地草稿");
            } catch (e) {
                loadOnline();
            }
        } else {
            loadOnline();
        }

        function loadOnline() {
            fetch("data.json", { cache: "no-store" })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(applyData)
                .catch(function () { toast("初始数据加载失败，请导入 JSON 文件"); });
        }
    </script>
</body>
</html>
